name: meezan_clone
description: >-
  Unofficial educational UI clone of an Islamic banking app (Meezan Bank style),
  built with Flutter. Demo/mock data only. Not affiliated with Meezan Bank Limited.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
