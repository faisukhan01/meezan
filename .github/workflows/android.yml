name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Ensure platform scaffold (fills any missing android files)
        run: flutter create . --platforms android --org io.github.faisukhan01 --project-name meezan_clone

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meezan-clone-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-apk \
            --latest \
            --title "Meezan Mobile Clone – Latest APK" \
            --notes "Automated release build of the unofficial educational UI clone. Mock data only — not affiliated with Meezan Bank Limited." \
            || true
          gh release upload latest-apk build/app/outputs/flutter-apk/app-release.apk --clobber
